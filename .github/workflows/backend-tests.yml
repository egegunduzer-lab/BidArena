# Backend testleri: her push ve pull request'te gerçek PostgreSQL ile çalışır.
#
# Adımlar:
#   1. PostgreSQL 17 servis konteyneri açılır.
#   2. docs/schema.sql ve docs/seed.sql yüklenir.
#   3. check_db.py modellerin şemayla uyumunu doğrular.
#   4. pytest tüm testleri çalıştırır (eşzamanlılık testleri dahil).
#   5. Test sonuçları (JUnit XML) indirilebilir artifact olarak saklanır.
name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bidarena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: bidarena_test
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/bidarena_test
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/bidarena_test

    steps:
      - name: Kodu al
        uses: actions/checkout@v5

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Bağımlılıkları yükle
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Veritabanı şemasını ve örnek veriyi yükle
        run: |
          psql -v ON_ERROR_STOP=1 -q -f docs/schema.sql
          psql -v ON_ERROR_STOP=1 -q -f docs/seed.sql

      - name: Model / şema uyumu (check_db.py)
        working-directory: backend
        run: python check_db.py

      - name: Testleri çalıştır
        working-directory: backend
        run: python -m pytest -v --junitxml=test-results.xml

      - name: Test sonuçlarını sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results.xml
